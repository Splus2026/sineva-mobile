name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
      - name: Тесты ядра
        run: python tests/run_core_tests.py
      - name: Сборка
        # GitHub иногда отвечает 503/504 при скачивании исходников — сборка повторяется (скачанное сохраняется)
        run: |
          for i in 1 2 3 4 5 6; do
            buildozer -v android debug && exit 0
            echo "Попытка $i не удалась, повтор через 60 с"
            sleep 60
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: sineva-apk
          path: bin/*.apk

